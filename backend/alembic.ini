# Alembic configuration for UrbanChange AI backend
# This file is read by 'alembic' commands.
# The actual DATABASE_URL is set via the env var DATABASE_URL (see alembic/env.py).

[alembic]
# Location of migration scripts, relative to this file.
script_location = alembic

# Template for generating new migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files.
timezone = UTC

# Prepend the current sys.path with the backend root so ORM models can be imported.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
