services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbanchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-urbanchange}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urbanchange}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - urbanchange-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanchange-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:3000","http://localhost:80","http://localhost","http://localhost:8080"]'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-urbanchange}
      STORAGE_ROOT: /data/storage
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      API_KEY: ${API_KEY:-}
      # Adapter modes: ML defaults to http (real SatQuery model), others mock unless live profile
      SATELLITE_ADAPTER: ${SATELLITE_ADAPTER:-mock}
      ML_ADAPTER: ${ML_ADAPTER:-http}
      GIS_ADAPTER: ${GIS_ADAPTER:-mock}
      INTELLIGENCE_ADAPTER: ${INTELLIGENCE_ADAPTER:-mock}
      # HTTP adapter base URLs
      SATELLITE_BASE_URL: ${SATELLITE_BASE_URL:-http://satellite:8001}
      SATELLITE_TIMEOUT_SECONDS: ${SATELLITE_TIMEOUT_SECONDS:-120}
      ML_BASE_URL: ${ML_BASE_URL:-http://ml:8002}
      GIS_BASE_URL: ${GIS_BASE_URL:-http://gis:8003}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-http://intelligence:8004}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - urbanchange-net

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: urbanchange-ml
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      STORAGE_ROOT: /data/storage
      ML_WEIGHTS_PATH: /app/weights/best_siamese_model.pth
      ML_DEVICE: ${ML_DEVICE:-cpu}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ml/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - urbanchange-net

  frontend:
    build:
      context: ./frontend/urbanchange-ui
      dockerfile: Dockerfile
    container_name: urbanchange-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "${FRONTEND_DEV_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - urbanchange-net

  # ── Live Services (Role 2 Satellite, Role 3 GIS, Role 6 Intelligence) ────────
  satellite:
    build:
      context: ./satellite
      dockerfile: Dockerfile
    container_name: urbanchange-satellite
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      STORAGE_ROOT: /data/storage
      DATA_DIR: /data/storage
      MIN_AOI_KM2: ${MIN_AOI_KM2:-0.25}
      MAX_CLOUD: ${MAX_CLOUD:-20.0}
      DATE_WINDOW_DAYS: ${DATE_WINDOW_DAYS:-30}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - urbanchange-net

  gis:
    build:
      context: ./gis
      dockerfile: Dockerfile
    container_name: urbanchange-gis
    restart: unless-stopped
    profiles:
      - live
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DATA_DIR: /data/storage
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - urbanchange-net

  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: urbanchange-intelligence
    restart: unless-stopped
    profiles:
      - live
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3:8b}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - urbanchange-net

  # ── Optional Ollama Profile for local LLM inference ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: urbanchange-ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - urbanchange-net

volumes:
  postgres_data:
  storage_data:
  ollama_data:

networks:
  urbanchange-net:
    driver: bridge
