services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbanchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-urbanchange}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urbanchange}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - urbanchange-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanchange-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-urbanchange}
      STORAGE_ROOT: /data/storage
      # Adapter modes: default to mock for turnkey startup without external services
      SATELLITE_ADAPTER: ${SATELLITE_ADAPTER:-mock}
      ML_ADAPTER: ${ML_ADAPTER:-mock}
      GIS_ADAPTER: ${GIS_ADAPTER:-mock}
      INTELLIGENCE_ADAPTER: ${INTELLIGENCE_ADAPTER:-mock}
      # HTTP adapter base URLs (used when an adapter is switched to http mode)
      SATELLITE_BASE_URL: ${SATELLITE_BASE_URL:-http://host.docker.internal:8001}
      ML_BASE_URL: ${ML_BASE_URL:-http://host.docker.internal:8002}
      GIS_BASE_URL: ${GIS_BASE_URL:-http://host.docker.internal:8003}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-http://host.docker.internal:8004}
    volumes:
      - storage_data:/data/storage
    networks:
      - urbanchange-net

volumes:
  postgres_data:
  storage_data:

networks:
  urbanchange-net:
    driver: bridge
